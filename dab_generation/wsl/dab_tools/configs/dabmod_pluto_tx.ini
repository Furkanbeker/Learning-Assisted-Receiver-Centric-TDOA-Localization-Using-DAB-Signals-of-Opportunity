; ODR-DabMod base configuration for transmission with an ADALM-PLUTO.
; run_dabmod_tx.sh copies this file to dabmod_runtime.ini and replaces the
; Pluto URI, the frequency and the TX gain with the values from the GUI.

[input]
; ETI file to transmit (a symbolic link to the selected ETI), played in a loop
transport=file
source=eti/myfirst.eti
loop=1

[modulator]
gainmode=var
digital_gain=0.95
; Output sample rate (DAB Mode I baseband, 2.048 MS/s)
rate=2048000

[firfilter]
enabled=1

[output]
output=soapysdr

[soapyoutput]
device=driver=plutosdr,uri=ip:192.168.2.1
samplerate=2048000
txgain=60
frequency=220352000

[delaymanagement]
synchronous=0
mutenotimestamps=0
offset=0.0
